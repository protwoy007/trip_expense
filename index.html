<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030407">
<title>Trip Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030407;--blue:#155BC9;--lime:#D4FF24;--s1:#080b13;--s2:#0e1320;--line:#161d30;--tx:#eef1f8;--mu:#8590aa;--blue-soft:rgba(21,91,201,.22);--lime-soft:rgba(212,255,36,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,.num{font-family:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;letter-spacing:-.02em;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.top .hbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:28px;padding-bottom:20px;flex-wrap:wrap}
.trip{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(28px,5vw,42px);line-height:1.05;letter-spacing:-.03em}
.sub{color:var(--mu);margin-top:6px}
.hr{display:flex;gap:10px;align-items:center}
nav{position:sticky;top:0;z-index:20;background:rgba(3,4,7,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.navin{display:flex;gap:4px}
nav button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:14px 16px;color:var(--mu);cursor:pointer;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
nav button:hover{color:var(--tx)}
nav button svg{display:none}
nav button.on{color:var(--tx);border-bottom-color:var(--lime)}
main{padding:26px 0 90px}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--mu)}
.btn.pri{background:var(--lime);color:var(--bg);border-color:var(--lime)}
.btn.pri:hover{filter:brightness(.92)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;color:var(--mu)}
.lnk{background:none;border:0;color:var(--lime);cursor:pointer;font-size:13.5px;padding:0;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:22px}
.card h2{font-size:19px}
.hint{color:var(--mu);font-size:14px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h2{font-size:26px}
.pagehead p{color:var(--mu);font-size:14px;margin-top:2px}
.sec{margin-top:16px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));margin-top:16px}
.pane{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pane .sech{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 10px}
.pane .sech h2{font-size:18px}
.pane .pb{padding:4px 20px 20px}
.hero .lbl{color:var(--mu);font-size:14px}
.hero .big{font-size:clamp(42px,9vw,68px);line-height:1;margin-top:6px}
.hero .sub2{color:var(--mu);margin-top:8px}
.hero .hh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.mbar{display:flex;gap:3px;height:42px;border-radius:12px;overflow:hidden;background:var(--s2);margin:22px 0 14px}
.mbar i{display:block;height:100%;min-width:3px}
.mbar .sp{background:var(--lime)}
.mbar .fd{background:var(--blue)}
.mbar .td{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.16) 5px 7px);border:1px dashed #4a5572;border-radius:3px 10px 10px 3px}
.lg{display:flex;gap:8px 26px;flex-wrap:wrap;font-size:14px;color:var(--mu)}
.lg b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.lg b.sp{background:var(--lime)}.lg b.fd{background:var(--blue)}.lg b.td{border:1px dashed #6b7799}
.lg em{color:var(--tx);font-style:normal;font-weight:700;margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi .l{color:var(--mu);font-size:13.5px}
.kpi .v{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:25px;line-height:1.2;margin-top:2px}
.kpi .s{color:var(--mu);font-size:13px}
.todo{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid #4a5572;display:grid;place-items:center;font-size:13px;flex:none}
.tick.done{background:var(--lime);border-color:var(--lime);color:var(--bg);font-weight:700}
.rows{background:var(--s1);border:1px solid var(--line);border-radius:18px}
.ri{display:flex;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.ri:first-child{border-top:0;border-radius:18px 18px 0 0}
.ri:last-child{border-radius:0 0 18px 18px}
.ri:only-child{border-radius:18px}
.ri.gone{opacity:.5}
.ri.gone .rt{text-decoration:line-through}
.av{width:38px;height:38px;border-radius:12px;background:var(--blue-soft);color:#a9c6ff;display:grid;place-items:center;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;flex:none}
.rm{flex:1;min-width:0}
.rt{font-weight:500;font-size:15.5px;overflow-wrap:anywhere}
.rs{color:var(--mu);font-size:13.5px}
.rn{color:#c5cce0;font-size:13.5px;margin-top:3px;white-space:pre-wrap}
.ra{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;white-space:nowrap}
.ra.pos{color:var(--lime)}
.badge{background:var(--s2);border:1px solid var(--line);color:var(--mu);border-radius:999px;font-size:12px;padding:0 8px;margin-left:6px;cursor:pointer;font-weight:400}
span.badge{cursor:default}
.dayh{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin:24px 4px 10px}
.dayh b{color:var(--tx)}
.sum{color:var(--mu);font-size:14px;margin-bottom:4px}
.sum b{color:var(--tx)}
.st{background:var(--s2);color:var(--mu);border-radius:999px;font-size:13px;font-weight:700;padding:3px 11px;white-space:nowrap}
.st.owe{background:var(--blue);color:#fff}
.st.ok{background:var(--lime-soft);color:var(--lime)}
.menu{position:relative;display:inline-block}
.menu>summary{list-style:none;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--mu);font-size:20px;line-height:1}
.menu>summary::-webkit-details-marker{display:none}
.menu>summary:hover,.menu[open]>summary{background:var(--s2);color:var(--tx)}
.mn{position:absolute;right:0;top:calc(100% + 6px);background:var(--s2);border:1px solid #222c47;border-radius:12px;padding:6px;min-width:176px;z-index:40;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.mn button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14.5px}
.mn button:hover{background:var(--blue-soft)}
.menu.hdrm>summary{width:auto;padding:0 14px;height:36px;border:1px solid var(--line);color:var(--tx);font-size:14px;font-weight:700;background:var(--s2)}
.menu.fab{position:fixed;right:22px;bottom:26px;z-index:30}
.menu.fab>summary{width:58px;height:58px;border-radius:50%;background:var(--lime);color:var(--bg);font-size:32px;font-weight:500;box-shadow:0 10px 30px rgba(212,255,36,.22)}
.menu.fab>summary:hover,.menu.fab[open]>summary{background:var(--lime);color:var(--bg);filter:brightness(.94)}
.menu.fab .mn{top:auto;bottom:calc(100% + 10px)}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:7px 18px;border-radius:9px;cursor:pointer;color:var(--mu);font-weight:500}
.seg .on{background:var(--lime);color:var(--bg);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
details.more{margin-bottom:12px}
details.more summary{cursor:pointer;color:var(--mu);font-size:14px;padding:2px 0 10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.facts div{background:var(--s1);padding:14px 18px}
.facts span{display:block;color:var(--mu);font-size:13.5px}
.facts b{font-family:'Bricolage Grotesque',sans-serif;font-size:21px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--mu);font-weight:500;font-size:13.5px;padding:13px 18px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 18px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tfoot td{background:var(--s2);font-weight:700}
.tbl tfoot td:first-child{border-bottom-left-radius:17px}
.tbl tfoot td:last-child{border-bottom-right-radius:17px}
.tbl td.net{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;white-space:nowrap}
.tbl td.net small{display:block;font-family:'Hanken Grotesk',sans-serif;font-weight:400;font-size:12.5px;color:var(--mu)}
.tbl td.net.pos{color:var(--lime)}
.tbl td.net.neg{color:#8fb4ff}
.tbl .ta{text-align:right;white-space:nowrap}
.mb{height:5px;background:var(--s2);border-radius:3px;margin-top:7px;max-width:170px;overflow:hidden}
.mb i{display:block;height:100%;background:var(--blue)}
.mb i.l{background:var(--lime)}
.bars{display:flex;align-items:flex-end;gap:5px;height:170px;overflow-x:auto}
.bar{flex:1 0 20px;max-width:64px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.bar i{display:block;width:100%;background:var(--blue);border-radius:5px 5px 2px 2px;min-height:2px}
.bar.mx i{background:var(--lime)}
.bar span{font-size:11px;color:var(--mu)}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;margin:11px 0;font-size:14px}
.hb .t{height:10px;background:var(--s2);border-radius:5px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--blue);border-radius:5px}
.log{position:relative;padding-left:30px}
.log::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.commit{position:relative;margin-bottom:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 16px}
.commit::before{content:"";position:absolute;left:-28px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--blue)}
.commit.create::before{border-color:var(--lime)}
.commit.delete::before{background:var(--blue)}
.commit.revert::before,.commit.restore::before{border-color:var(--lime);background:var(--lime)}
.cmsg{font-weight:500;overflow-wrap:anywhere}
.cmeta{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;color:var(--mu);font-size:13px;margin-top:5px}
.empty{border:1px dashed #243049;border-radius:18px;padding:34px 18px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:4px;font-family:'Bricolage Grotesque',sans-serif}
.pane .empty{border:0;padding:26px 18px}
.notice{background:var(--lime-soft);border:1px solid rgba(212,255,36,.28);border-radius:12px;padding:9px 14px;font-size:13.5px;margin-bottom:14px}
dialog{background:var(--s1);color:var(--tx);border:1px solid #222c47;border-radius:22px;padding:24px;width:min(500px,calc(100vw - 24px));max-height:92vh;overflow:auto;margin:auto}
dialog.wide{width:min(660px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(3,4,7,.82);backdrop-filter:blur(3px)}
dialog h3{font-size:22px;margin-bottom:16px}
dialog h4{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;margin:6px 0 10px}
dialog hr{border:0;border-top:1px solid var(--line);margin:18px 0}
form label{display:block;font-size:13.5px;color:var(--mu);margin-bottom:13px}
form input:not([type=checkbox]),form select,form textarea{display:block;width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--tx)}
form input:focus,form select:focus,form textarea:focus{border-color:var(--blue);outline:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.g2{grid-template-columns:1fr}}
label.chk{display:inline-flex;align-items:center;gap:7px;margin:0;color:var(--tx);font-size:14.5px}
label.chk input{accent-color:var(--lime);width:16px;height:16px}
.err{color:var(--lime);font-size:13.5px;min-height:20px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(30px);background:var(--lime);color:var(--bg);font-weight:700;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 24px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{background:var(--bg);color:var(--lime);border:0;border-radius:8px;padding:4px 12px;cursor:pointer;font-weight:700}
footer{color:var(--mu);font-size:13.5px;text-align:center;padding:10px 0 46px}
footer .sync{font-size:12.5px;margin-top:2px}
.only-m{display:none!important}
[hidden]{display:none!important}
.tsel{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:36px;font-weight:700;font-size:14px;max-width:190px}
.shd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:28px 0 10px}
.shd h3{font-family:'Bricolage Grotesque',sans-serif;font-size:19px}
@media(max-width:700px){
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  .navin{padding:0 6px;gap:0}
  nav button{flex:1;flex-direction:column;gap:3px;font-size:12px;padding:9px 0 8px;border-bottom:0;margin:0}
  nav button svg{display:block}
  nav button.on{color:var(--lime)}
  body{padding-bottom:78px}
  .menu.fab{bottom:92px;right:18px}
  .ri{padding:12px 14px;gap:12px}
  .tbl th,.tbl td{padding:12px 10px}
  .tbl th:first-child,.tbl td:first-child{padding-left:14px}
  .hide-m{display:none!important}
  .only-m{display:block!important}
  dialog{margin:auto auto 0;border-radius:22px 22px 0 0;width:100vw;max-height:94vh}
  dialog.wide{width:100vw}
  #toast{bottom:96px}
}
.nm{background:none;border:0;padding:0;text-align:left;font-weight:500;cursor:pointer;color:var(--tx)}
.nm:hover{color:var(--lime)}
.chkgrid{display:flex;flex-wrap:wrap;gap:10px 18px;padding:2px 0 12px}
.sk{height:96px;border-radius:20px;margin-bottom:14px;background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 50%,var(--s1) 75%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000;padding:0}nav,.menu,.btn,.filters,footer,#toast,.seg,.notice{display:none!important}
  .card,.pane,.rows,.ri,.commit,.kpi{background:#fff;border-color:#ccc;color:#000}
  .rs,.sub,.hint,.sum,.dayh,.lg,.kpi .l,.kpi .s{color:#444}.mbar .sp,.mbar .fd{background:#888}
}
</style>
</head>
<body>
<script src="config.js"></script>

<header class="top"><div class="wrap hbar">
  <div><div class="trip" id="tripName">Trip Ledger</div><div class="sub" id="tripSub"></div></div>
  <div class="hr" id="hdr"></div>
</div></header>
<nav><div class="wrap navin" id="navin"></div></nav>
<div class="wrap"><div id="note" style="margin-top:18px"></div><main id="app"></main><footer id="foot"></footer></div>
<div id="fab"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script type="module">
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const fmtTime = ts => new Date(ts).toLocaleString('en-GB', {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true});
const fmtDate = d => new Date(d + 'T00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, '0').slice(0, 7); };
const clean = o => JSON.parse(JSON.stringify(o));
const ADMIN_EMAILS = (window.ADMIN_EMAILS || []).map(e => String(e).toLowerCase());
const DEFAULT_CATS = ['Food', 'Transport', 'Stay', 'Tickets', 'Shopping', 'Fuel', 'Medical', 'Other'];

const DEF = () => ({trips: [], people: [], expenses: [], contributions: [], history: [], settings: {trip: 'Our Trip', destination: '', start: '', end: '', budget: 0, cur: '৳', cats: DEFAULT_CATS.slice()}});
let S = DEF(), R = DEF(), TID = null, ADMIN = false, B = null, tab = 'dash', READY = true;
let PREF = (() => { try { return localStorage.getItem('tl-trip'); } catch { return null; } })();
const F = {q: '', cat: '', who: '', from: '', to: '', sort: 'date-desc', del: false};
const CF = {who: '', q: '', del: false};
const HF = {q: '', type: '', action: ''};
const MF = {q: '', sort: 'owe'};
let pv = 'bal';
const G = {F, CF, HF, MF};

const money = n => { n = Number(n || 0); return (n < 0 ? '-' : '') + S.settings.cur + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2}); };
const act = a => a.filter(x => !x.deleted);
const PEND = {};
const pname = id => S.people.find(p => p.id === id)?.name || PEND[id] || 'Unknown';
const nowT = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fmtClock = t => { if (!t) return ''; const [h, m] = t.split(':'); return (+h % 12 || 12) + ':' + m + (+h < 12 ? ' am' : ' pm'); };
const toast = (m, label, fn) => {
  const t = $('#toast'); t.innerHTML = `<span>${esc(m)}</span>` + (label ? `<button>${esc(label)}</button>` : '');
  const b = t.querySelector('button'); if (b) b.onclick = () => { t.classList.remove('on'); fn(); };
  t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), label ? 6500 : 2400);
};

/* ---------- backends ---------- */
function localBackend() {
  const K = 'trip-ledger-v1';
  let data = JSON.parse(localStorage.getItem(K) || 'null') || {...DEF(), settings: {...DEF().settings, user: 'admin', pass: 'admin123'}};
  data.trips = data.trips || [];
  let cb;
  const emit = () => { localStorage.setItem(K, JSON.stringify(data)); cb(data); };
  return {
    mode: 'local',
    init(c) { cb = c; ADMIN = sessionStorage.getItem('tl-admin') === '1'; cb(data); },
    commit(ops) {
      ops.forEach(o => {
        if (o.c === 'meta') { data.settings = {...data.settings, ...o.data}; return; }
        const a = data[o.c] || (data[o.c] = []), i = a.findIndex(x => x.id === o.id);
        if (o.del) { if (i > -1) a.splice(i, 1); }
        else if (i > -1) a[i] = {...o.data, id: o.id};
        else a.push({...o.data, id: o.id});
      });

    },

async function fbBackend() {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, A, Fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(window.FIREBASE_CONFIG);
  if (window.APPCHECK_SITE_KEY) {
    const AC = await import(base + 'firebase-app-check.js');
    AC.initializeAppCheck(app, {provider: new AC.ReCaptchaV3Provider(window.APPCHECK_SITE_KEY), isTokenAutoRefreshEnabled: true});
  }
  const auth = A.getAuth(app);
  const db = Fs.initializeFirestore(app, {localCache: Fs.persistentLocalCache({tabManager: Fs.persistentMultipleTabManager()})});
  const st = DEF();
  return {
    mode: 'firebase',
    init(cb) {
      const seen = new Set(), mark = k => { seen.add(k); st.__ready = seen.size >= 7; };
      ['people', 'expenses', 'contributions', 'history', 'trips'].forEach(c =>
        Fs.onSnapshot(Fs.collection(db, c), s => { st[c] = s.docs.map(d => ({...d.data(), id: d.id})); mark(c); cb(st); }, e => { console.error(c, e); mark(c); cb(st); }));
      Fs.onSnapshot(Fs.doc(db, 'meta', 'settings'), s => { if (s.exists()) st.settings = {...DEF().settings, ...s.data()}; mark('meta'); cb(st); }, e => { console.error(e); mark('meta'); cb(st); });
      A.onAuthStateChanged(auth, u => { ADMIN = !!u && ADMIN_EMAILS.includes((u.email || '').toLowerCase()); mark('auth'); cb(st); });
    },
    async commit(ops) {
      for (let i = 0; i < ops.length; i += 400) {
        const b = Fs.writeBatch(db);
        ops.slice(i, i + 400).forEach(o => {
          const r = Fs.doc(db, o.c, o.id);
          if (o.del) b.delete(r);
          else { const {id, ...d} = clean(o.data); b.set(r, d, {merge: o.c === 'meta'}); }
        });
        await b.commit();
      }
    },
    login: (u, p) => A.signInWithEmailAndPassword(auth, u.trim().toLowerCase().includes('@') ? u.trim().toLowerCase() : u.trim().toLowerCase() + '@trip.app', p),
    logout: () => A.signOut(auth),
    async changePassword(cur, nw) {
      const u = auth.currentUser;
      await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email, cur));
      await A.updatePassword(u, nw);
    }
  };
}

/* ---------- change tracking (git-like) ---------- */
const COLL = {expense: 'expenses', contribution: 'contributions', person: 'people', trip: 'trips'};
const EXC = {none: 'None', exempt: 'Pays no share', custom: 'Custom target'};
const FIELDS = {
  expense: [['name','Name'],['amount','Amount'],['date','Track date'],['time','Time'],['category','Category'],['place','Place'],['splitAmong','Split among'],['note','Notes'],['deleted','Deleted']],
  contribution: [['personId','Person'],['amount','Amount'],['date','Date'],['time','Time'],['method','Method'],['ref','Reference'],['note','Notes'],['deleted','Deleted']],
  person: [['name','Name'],['exception','Exception'],['target','Custom target'],['deleted','Deleted']],
  trip: [['name','Trip name'],['destination','Destination'],['start','Start date'],['end','End date'],['budget','Target budget'],['live','Visible to everyone']]
};
function fmtVal(f, v) {
  if (f === 'target') return v ? money(v) : '-';
  if (f === 'amount' || f === 'budget') return money(v);
  if (f === 'personId') return pname(v);
  if (f === 'splitAmong') return !v || !v.length ? 'Everyone' : v.map(pname).join(', ');
  if (f === 'exception') return EXC[v || 'none'];
  if (f === 'live') return v === false ? 'no' : 'yes';
  if (f === 'deleted') return v ? 'yes' : 'no';
  if (f === 'date' || f === 'start' || f === 'end') return v ? fmtDate(v) : '-';
  if (f === 'time') return v ? fmtClock(v) : '-';
  return v === '' || v == null ? '-' : String(v);
}
function entName(type, o) {
  if (type === 'contribution') return pname(o.personId) + ' ' + money(o.amount);
  return o.name;
}
function current(type, id) {
  if (type === 'trip') return S.trips.find(x => x.id === id);
  return S[COLL[type]].find(x => x.id === id);
}
const fail = e => toast(e.code === 'permission-denied' ? 'Permission denied. Publish the Firestore rules for your admin email.' : 'Save failed: ' + (e.code || e.message));
function mkEntry(o) {
  const ts = Date.now();
  return {ts, who: 'admin', changes: [], reason: '', before: null, after: null, ...o, hash: hash(ts + JSON.stringify(o.after) + o.message)};
}
function commitChange(type, before, after, reason, action) {
  const changes = [];
  FIELDS[type].forEach(([f, l]) => {
    const a = before ? before[f] : undefined, b = after[f];
    if (JSON.stringify(a ?? '') !== JSON.stringify(b ?? '')) changes.push({field: f, label: l, from: before ? fmtVal(f, a) : null, to: fmtVal(f, b)});
  });
  if (before && !changes.length) { toast('Nothing changed'); return false; }
  if (type === 'person') PEND[after.id] = after.name;
  const nm = type === 'contribution' ? pname(after.personId) : entName(type, after);
  const verb = {create: 'Added', update: 'Updated', delete: 'Deleted', restore: 'Restored', revert: 'Reverted'}[action];
  let message = `${verb} ${type} "${nm}"`;
  if (action === 'create' && (type === 'expense' || type === 'contribution')) message += ` ${type === 'expense' ? 'for' : 'of'} ${money(after.amount)}`;
  if ((action === 'update' || action === 'revert') && changes.length) message += ': ' + changes.filter(c => c.field !== 'deleted').map(c => `${c.label} ${c.from} to ${c.to}`).join('; ');
  if (reason) message += ` (${reason})`;
  const entry = mkEntry({action, type, entityId: after.id, entityName: nm, changes, reason: reason || '', message,
    before: before ? clean(before) : null, after: clean(after), tripId: type === 'trip' ? after.id : (after.tripId || TID)});
  B.commit([{c: COLL[type], id: after.id, data: after}, {c: 'history', id: uid(), data: entry}]).catch(fail);
  return true;
}

/* ---------- calculations ---------- */
function calc() {
  const ppl = act(S.people), ex = act(S.expenses), co = act(S.contributions);
  const n = ppl.length, target = +S.settings.budget || 0;
  const reg = ppl.filter(p => !p.exception || p.exception === 'none'), fixed = ppl.filter(p => p.exception === 'custom');
  const each = reg.length ? Math.max(0, target - fixed.reduce((s, p) => s + (+p.target || 0), 0)) / reg.length : 0;
  const goal = p => p.exception === 'exempt' ? 0 : p.exception === 'custom' ? +p.target || 0 : each;
  const wt = p => p.exception === 'exempt' ? 0 : p.exception === 'custom' ? (each > 0 ? (+p.target || 0) / each : 1) : 1;
  const per = {}; S.people.forEach(p => per[p.id] = {p, given: 0, share: 0, bal: 0, net: 0, goal: goal(p), w: wt(p)});
  let total = 0, collected = 0;
  co.forEach(c => { const a = +c.amount; collected += a; if (per[c.personId]) per[c.personId].given += a; });
  ex.forEach(e => {
    const a = +e.amount; total += a;
    const ids = (e.splitAmong?.length ? e.splitAmong : ppl.map(p => p.id)).filter(id => per[id] && per[id].w > 0);
    const tw = ids.reduce((s, id) => s + per[id].w, 0);
    ids.forEach(id => per[id].share += a * per[id].w / tw);
  });
  Object.values(per).forEach(r => { r.bal = r.given - r.goal; r.net = r.given - r.share; });
  return {per, n, target, each, total, collected, toCollect: Math.max(0, target - collected), fund: collected - total, ex, co, ppl};
}

function dailyChart(ex) {
  const m = {}; ex.forEach(e => m[e.date] = (m[e.date] || 0) + +e.amount);
  const ds = Object.keys(m).sort();
  if (!ds.length) return '<p class="hint">No expenses yet.</p>';
  const out = []; const d = new Date(ds[0] + 'T00:00'), end = new Date(ds[ds.length - 1] + 'T00:00');
  while (d <= end && out.length < 120) { const k = ymd(d); out.push([k, m[k] || 0]); d.setDate(d.getDate() + 1); }
  const mx = Math.max(...out.map(x => x[1]), 1);
  return `<div class="bars">${out.map(([k, v]) => `<div class="bar ${v === mx ? 'mx' : ''}" title="${fmtDate(k)}: ${money(v)}"><i style="height:${v / mx * 82}%"></i><span>${k.slice(8)}</span></div>`).join('')}</div>`;
}

/* settle up */
const isFinal = () => !!S.settings.end && today() > S.settings.end;
function settleData() {
  const c = calc();
  const rows = Object.values(c.per).filter(r => !r.p.deleted || r.given || r.share).map(r => ({...r, net: Math.round(r.net * 100) / 100}));
  rows.sort((a, b) => b.net - a.net || a.p.name.localeCompare(b.p.name));
  return {c, rows, back: rows.filter(r => r.net > 0.009), pay: rows.filter(r => r.net < -0.009)};
}
function summaryText() {
  const {c, back, pay} = settleData(), L = [`${S.settings.trip} - settlement${isFinal() ? '' : ' (estimate so far)'}`, `Collected: ${money(c.collected)}`, `Spent: ${money(c.total)}`, `${c.fund >= 0 ? 'Left to give back' : 'Short by'}: ${money(Math.abs(c.fund))}`, ''];
  if (back.length) L.push('Gets back:', ...back.map(r => `- ${r.p.name}: ${money(r.net)}`), '');
  if (pay.length) L.push('Needs to pay:', ...pay.map(r => `- ${r.p.name}: ${money(-r.net)}`), '');
  L.push('Full details: ' + location.href.split('#')[0]);
  return L.join('\n');
}
function shareSummary() {
  const t = summaryText();
  if (navigator.share) navigator.share({title: S.settings.trip, text: t}).catch(() => {});
  else window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}
function copySummary() { (navigator.clipboard?.writeText(summaryText()) || Promise.reject()).then(() => toast('Summary copied'), () => toast('Could not copy')); }
function vSet() {
  const {c, rows} = settleData(), fin = isFinal();

  return `<div class="pagehead"><div><h2>Settle up</h2><p>${fin ? 'The final amounts for the end of the trip.' : 'What each member would get back if the trip ended today.'}</p></div>
    <div class="row"><button class="btn" data-act="print">Print</button><button class="btn" data-act="copy">Copy summary</button><button class="btn pri" data-act="share">Share summary</button></div></div>
  ${fin ? '' : `<div class="notice">This is an estimate and changes as more is spent. It becomes final after the trip end date${S.settings.end ? '' : ' (set one in Settings)'}.</div>`}
  <div class="facts"><div><span>Collected</span><b>${money(c.collected)}</b></div><div><span>Total spent</span><b>${money(c.total)}</b></div>
    <div><span>${c.fund >= 0 ? 'Left to give back' : 'Short by'}</span><b>${money(Math.abs(c.fund))}</b></div><div><span>Average cost per person</span><b>${money(c.n ? c.total / c.n : 0)}</b></div></div>
  ${rows.length ? `<div class="rows"><table class="tbl"><thead><tr><th>Member</th><th>Gave</th><th class="hide-m">Share of cost</th><th>Result</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><button class="nm" data-act="member" data-id="${r.p.id}">${esc(r.p.name)}</button>${r.p.deleted ? ' <span class="badge">removed</span>' : ''}</td><td>${money(r.given)}</td><td class="hide-m">${money(r.share)}</td>
      <td>${r.net > 0.009 ? `<span class="st ok">Gets back ${money(r.net)}</span>` : r.net < -0.009 ? `<span class="st owe">Pays ${money(-r.net)}</span>` : '<span class="st">Settled</span>'}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td><td>${money(sg)}</td><td class="hide-m">${money(ss)}</td><td>${sgn(sn)}</td></tr></tfoot></table></div>
  <p class="hint" style="margin-top:14px">Result is what a member gave minus their share of the spending. Members who get money back are paid from the fund, and members who owe pay into it. The total in the last row is the money left in the fund.</p>`

  if (!ppl.length && !c) { toast('Add people first'); return; }
  openDlg(`<form data-form="contribution" data-id="${id || ''}"><h3>${c ? 'Edit money' : 'Add money'}</h3>
    <label>Person<select name="personId">${ppl.map(p => opt(p.id, c?.personId || pid, p.name)).join('')}</select></label>
    <div class="g2"><label>Amount given<input name="amount" type="number" step="0.01" min="0.01" required value="${c?.amount ?? ''}"></label>
    <label>Paid by<select name="method">${['Cash', 'bKash', 'Nagad', 'Rocket', 'Bank', 'Other'].map(m => opt(m, c?.method)).join('')}</select></label></div>
    <label>Reference or transaction ID (optional)<input name="ref" value="${esc(c?.ref)}" placeholder="TrxID"></label>
    <div class="g2"><label>Date<input name="date" type="date" required value="${c?.date || today()}"></label>
    <label>Time<input name="time" type="time" required value="${c?.time || nowT()}"></label></div>
    <label>Notes<textarea name="note" rows="2">${esc(c?.note)}</textarea></label>
    ${c ? `<label>Commit message (optional)<input name="reason" placeholder="Why this change?"></label>` : ''}${btnRow}</form>`);
}
function pplForm(id) {
  const p = id ? S.people.find(x => x.id === id) : null, ex = p?.exception || 'none';
  openDlg(`<form data-form="person" data-id="${id || ''}"><h3>${p ? 'Edit member' : 'Add member'}</h3>
    <label>Name<input name="name" required value="${esc(p?.name)}"></label>
    <label>Exception<select name="exception" onchange="this.form.querySelector('[data-cust]').hidden=this.value!=='custom'">${[['none', 'None, pays an equal share'], ['exempt', 'Pays no share'], ['custom', 'Custom target amount']].map(([v, l]) => opt(v, ex, l)).join('')}</select></label>
    <label data-cust ${ex === 'custom' ? '' : 'hidden'}>Custom target amount<input name="target" type="number" min="0" step="0.01" value="${+p?.target || ''}"></label>
    ${p ? '' : `<label>Amount given so far (optional)<input name="given" type="number" min="0" step="0.01" placeholder="0"></label>`}
    <div class="row end"><button type="button" class="btn ghost" data-act="close">Cancel</button>${p ? '' : '<button class="btn" name="more" value="1">Save &amp; add another</button>'}<button class="btn pri">Save</button></div></form>`);
}
function catForm(old) {
  openDlg(`<form data-form="category" data-id="${esc(old || '')}"><h3>${old ? 'Rename category' : 'Add category'}</h3>
    <label>Name<input name="name" required value="${esc(old)}" placeholder="Snacks"></label>${btnRow}</form>`);
}
function saveCats(list, message, action, extra = []) {
  const e = mkEntry({action, type: 'category', entityId: 'cats', entityName: 'Categories', message, tripId: '*'});
  B.commit([{c: 'meta', id: 'settings', data: {cats: list}}, ...extra, {c: 'history', id: uid(), data: e}]).catch(fail);
}
function renameCat(old, nw) {
  const hit = R.expenses.filter(e => e.category === old);
  saveCats(catList().map(k => k === old ? nw : k), `Renamed category "${old}" to "${nw}" (${hit.length} ${hit.length === 1 ? 'expense' : 'expenses'} updated)`, 'update', hit.map(e => ({c: 'expenses', id: e.id, data: {...e, category: nw}})));
}
function delCat(name) {
  const list = catList();
  if (list.length <= 1) { toast('Keep at least one category'); return; }
  if (!confirm(`Delete category "${name}"? Existing expenses keep their label.`)) return;
  saveCats(list.filter(k => k !== name), `Deleted category "${name}"`, 'delete');
  toast('Category deleted');
}
function toggleLive(id) {
  const t = current('trip', id); if (!t) return;
  const off = t.live !== false;
  if (off && !confirm(`Turn off "${t.name}"? It stays saved and only admins can see it.`)) return;
  const {virtual, ...rest} = t;
  if (commitChange('trip', t, {...rest, live: !off, updatedAt: Date.now()}, '', 'update')) toast(off ? 'Trip turned off' : 'Trip is live');
}

function loginForm() {
  openDlg(`<form data-form="login"><h3>Admin sign in</h3><div class="err" id="lerr"></div>
    <label>Email or username<input name="u" required autocomplete="username" placeholder="Admin email"></label>
    <label>Password<input name="p" type="password" required autocomplete="current-password"></label>
    <div class="row end"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn pri">Sign in</button></div></form>`);
}
function entityHistory(type, id) {
  const l = R.history.filter(h => h.type === type && h.entityId === id);
  openDlg(`<h3>History</h3>${hisList(l)}<div class="row end"><button class="btn" data-act="close">Close</button></div>`, true);
}

function tripForm(id) {
  const t = id ? S.trips.find(x => x.id === id) : null, s = t || {name: '', destination: '', start: '', end: '', budget: 0, live: true}, c = calc();
  openDlg(`<form data-form="trip" data-id="${esc(id || '')}"><h3>${t ? 'Edit trip' : 'Add trip'}</h3>
    <label>Trip name<input name="name" required value="${esc(s.name)}"></label>
    <label>Destination<input name="destination" value="${esc(s.destination)}" placeholder="Sylhet"></label>
    <div class="g2"><label>Start date<input name="start" type="date" value="${esc(s.start)}"></label><label>End date<input name="end" type="date" value="${esc(s.end)}"></label></div>
    <label>Target budget (total to collect)<input name="budget" type="number" min="0" step="0.01" value="${+s.budget || ''}" placeholder="5000"></label>
    ${t && t.id === TID ? `<p class="hint" style="margin:-4px 0 14px">${c.n} members, so each regular member pays ${money(c.each)}. Set exceptions per member in Settings.</p>` : ''}
    <label class="chk" style="margin-bottom:14px"><input type="checkbox" name="live" ${s.live === false ? '' : 'checked'}>Visible to everyone</label>
    ${t ? `<label>Commit message (optional)<input name="reason" placeholder="Why this change?"></label>` : ''}${btnRow}</form>`);
}
function accountDlg() {
  openDlg(`<h3>Password and backup</h3>
    <h4>Admin password</h4>
    <form data-form="password"><div class="err" id="perr"></div>
      <label>Current password<input name="cur" type="password" required autocomplete="current-password"></label>
      <label>New password (6+ characters)<input name="nw" type="password" minlength="6" required autocomplete="new-password"></label>
      <button class="btn blue">Change password</button></form>
    <hr><h4>Backup</h4><p class="hint" style="margin-bottom:12px">Download everything as a JSON file, or restore from one. Restoring adds or overwrites records with the same id.</p>
    <div class="row"><button class="btn" data-act="backup">Download backup</button><button class="btn" data-act="restorefile">Restore from file</button></div>
    <input type="file" id="rf" accept=".json" hidden>
    <div class="row end" style="margin-top:20px"><button class="btn ghost" data-act="close">Close</button></div>`);
}

function onSubmit(ev) {
  const f = ev.target.closest('form[data-form]'); if (!f) return;
  ev.preventDefault();
  const fd = new FormData(f), v = n => (fd.get(n) ?? '').toString().trim(), now = Date.now(), id = f.dataset.id, kind = f.dataset.form;
  if (kind === 'login') {
    B.login(v('u'), fd.get('p')).then(() => { dlg.close(); toast('Signed in'); }).catch(() => { $('#lerr').textContent = 'Wrong username or password.'; });
    return;
  }
  if (!ADMIN) { toast('Sign in as admin to edit'); return; }
  if (kind === 'password') {
    B.changePassword(fd.get('cur'), fd.get('nw')).then(() => { toast('Password changed'); f.reset(); $('#perr').textContent = ''; })
      .catch(() => { $('#perr').textContent = 'Current password is wrong, or sign in again and retry.'; });
    return;
  }
  if (kind === 'expense') {
    const old = id ? S.expenses.find(x => x.id === id) : null;
    const after = {id: id || uid(), name: v('name'), amount: +v('amount'), date: v('date'), time: v('time'), category: v('category'), place: v('place'), tripId: old ? (old.tripId || 'main') : TID, splitAmong: fd.getAll('split').length === sharers().length ? [] : fd.getAll('split'),
      note: v('note'), createdAt: old?.createdAt || now, createdBy: old?.createdBy || 'admin', updatedAt: old ? now : null, deleted: false};
    if (commitChange('expense', old, after, v('reason'), old ? 'update' : 'create')) { dlg.close(); toast(old ? 'Expense updated' : 'Expense added'); }
  } else if (kind === 'contribution') {
    const old = id ? S.contributions.find(x => x.id === id) : null;
    const after = {id: id || uid(), tripId: old ? (old.tripId || 'main') : TID, personId: v('personId'), amount: +v('amount'), date: v('date'), time: v('time'), method: v('method'), ref: v('ref'), note: v('note'), createdAt: old?.createdAt || now, createdBy: 'admin', updatedAt: old ? now : null, deleted: false};
    if (commitChange('contribution', old, after, v('reason'), old ? 'update' : 'create')) { dlg.close(); toast(old ? 'Money updated' : 'Money added'); }
  } else if (kind === 'person') {
    const old = id ? S.people.find(x => x.id === id) : null, ex = v('exception') === 'none' ? '' : v('exception');
    const after = {id: id || uid(), tripId: old ? (old.tripId || 'main') : TID, name: v('name'), exception: ex, target: ex === 'custom' ? +v('target') || 0 : '', createdAt: old?.createdAt || now, updatedAt: old ? now : null, deleted: false};
    if (commitChange('person', old, after, '', old ? 'update' : 'create')) {
      const g = +v('given');
      if (!old && g > 0) commitChange('contribution', null, {id: uid(), tripId: TID, personId: after.id, amount: g, date: today(), time: nowT(), note: 'Amount given at start', createdAt: now, createdBy: 'admin', updatedAt: null, deleted: false}, '', 'create');
      if (!old && ev.submitter?.name === 'more') { toast(`${after.name} added. Add the next one.`); pplForm(); dlg.querySelector('[name=name]')?.focus(); }
      else { dlg.close(); toast(old ? 'Member updated' : 'Member added'); }
    }
  } else if (kind === 'trip') {
    const old = id ? S.trips.find(x => x.id === id) : null;
    const after = {id: id || uid(), name: v('name'), destination: v('destination'), start: v('start'), end: v('end'), budget: +v('budget') || 0, live: fd.has('live'), createdAt: old ? (old.createdAt ?? now) : now, updatedAt: old ? now : null};
    if (!old) setPref(after.id);
    if (commitChange('trip', old, after, v('reason'), old ? 'update' : 'create')) { dlg.close(); toast(old ? 'Trip saved' : 'Trip added'); }
  } else if (kind === 'category') {
    const nm = v('name'), list = catList();
    if (list.some(k => k.toLowerCase() === nm.toLowerCase() && k !== id)) { toast('That category already exists'); return; }
    if (!id) { saveCats([...list, nm], `Added category "${nm}"`, 'create'); dlg.close(); toast('Category added'); }
    else if (id !== nm) { renameCat(id, nm); dlg.close(); toast('Category renamed'); }
    else dlg.close();
  }
}

/* ---------- actions ---------- */
function csv() {
  const rows = [['Name', 'Amount', 'Track date', 'Time', 'Category', 'Where spent', 'Split among', 'Notes', 'Added at', 'Last edited']];
  filterExp().filter(e => !e.deleted).forEach(e => rows.push([e.name, e.amount, e.date, tm(e), e.category, e.place, fmtVal('splitAmong', e.splitAmong), e.note, fmtTime(e.createdAt), e.updatedAt ? fmtTime(e.updatedAt) : '']));
  const t = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  download('expenses.csv', '\ufeff' + t, 'text/csv');
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function softToggle(type, id, del, quiet) {
  const cur = current(type, id); if (!cur) return;
  if (del && type === 'person' && !confirm(`Remove ${cur.name}? Their payments stay in the records and you can restore them later.`)) return;
  if (!commitChange(type, cur, {...cur, deleted: del, updatedAt: Date.now()}, '', del ? 'delete' : 'restore')) return;
  if (del) toast('Deleted', 'Undo', () => softToggle(type, id, false, true)); else if (!quiet) toast('Restored');
}
function revert(hid) {
  const h = S.history.find(x => x.id === hid); if (!h) return;
  const cur = current(h.type, h.entityId); if (!cur) return;
  if (!confirm(`Undo "${h.message}"?`)) return;
  const target = h.before ? {...h.before} : h.type === 'trip' ? {...cur, live: false} : {...cur, deleted: true};
  delete target.virtual;
  target.updatedAt = Date.now();
  if (commitChange(h.type, cur, target, 'undo ' + h.hash, 'revert')) { if (dlg.open) dlg.close(); toast('Change undone'); }
}
function backup() {
  download('trip-backup.json', JSON.stringify({trips: tripsAll().map(({virtual, ...t}) => t), people: R.people, expenses: R.expenses, contributions: R.contributions, history: R.history, settings: {cur: R.settings.cur, cats: R.settings.cats}}, null, 2), 'application/json');
}
function restoreFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result), ops = [];
      ['trips', 'people', 'expenses', 'contributions', 'history'].forEach(c => (d[c] || []).forEach(x => { if (c !== 'history' || !S.history.some(y => y.id === x.id)) ops.push({c, id: x.id, data: x}); }));
      if (d.settings) ops.push({c: 'meta', id: 'settings', data: {id: 'settings', ...d.settings}});
      if (!ops.length) throw new Error('empty');
      B.commit(ops).then(() => toast(`Restored ${ops.length} records`)).catch(e => toast('Restore failed: ' + (e.code || e.message)));
    } catch { toast('That file is not a valid backup'); }
  };
  r.readAsText(file);
}

document.addEventListener('click', ev => {
  document.querySelectorAll('details.menu[open]').forEach(d => { if (!d.contains(ev.target) || ev.target.closest('.mn button')) d.open = false; });
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id, ty = t.dataset.t;
  if (a === 'tab') { tab = id; render(); window.scrollTo({top: 0}); }
  else if (a === 'goto-bal') { tab = 'ppl'; pv = 'bal'; render(); window.scrollTo({top: 0}); }
  else if (a === 'pv') { pv = id; render(); }
  else if (a === 'close') dlg.close();
  else if (a === 'login') loginForm();
  else if (a === 'logout') B.logout().then(() => toast('Signed out'));
  else if (a === 'add-trip') tripForm();
  else if (a === 'edit-trip') tripForm(id || TID);
  else if (a === 'pick-trip') { setPref(id); rebuild(); render(); }
  else if (a === 'trip-live') toggleLive(id);
  else if (a === 'add-cat') catForm();
  else if (a === 'edit-cat') catForm(id);
  else if (a === 'del-cat') delCat(id);
  else if (a === 'account') accountDlg();
  else if (a === 'add-exp') expForm();
  else if (a === 'edit-exp') expForm(id);
  else if (a === 'add-con') conForm(null, t.dataset.pid);
  else if (a === 'edit-con') conForm(id);
  else if (a === 'add-ppl') pplForm();
  else if (a === 'edit-ppl') pplForm(id);
  else if (a === 'del') softToggle(ty, id, true);
  else if (a === 'restore') softToggle(ty, id, false);
  else if (a === 'ehist') entityHistory(ty, id);
  else if (a === 'revert') revert(id);
  else if (a === 'member') memberDlg(id);
  else if (a === 'share') shareSummary();
  else if (a === 'copy') copySummary();
  else if (a === 'print') window.print();
  else if (a === 'csv') csv();
  else if (a === 'backup') backup();
  else if (a === 'restorefile') $('#rf').click();
});
const onFilter = ev => {
  const t = ev.target, g = G[t.dataset.g]; if (!g) return;
  g[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
  const l = $('#list'); if (!l) return;
  l.innerHTML = {exp: expList, ppl: peopleList, his: hisList}[tab]();
};
document.addEventListener('input', onFilter);
document.addEventListener('change', ev => {
  if (ev.target.dataset.trip !== undefined) { setPref(ev.target.value); rebuild(); render(); return; }
  if (ev.target.id === 'rf' && ev.target.files[0]) { restoreFile(ev.target.files[0]); ev.target.value = ''; return; }
  if (ev.target.dataset.g && ev.target.type !== 'search' && ev.target.type !== 'text') onFilter(ev);
});
document.addEventListener('submit', onSubmit);
addEventListener('online', render); addEventListener('offline', render);

/* ---------- boot ---------- */
const onState = d => { READY = d.__ready !== false; R = {...DEF(), ...d, settings: {...DEF().settings, ...d.settings}}; rebuild(); render(); };
(async () => {
  try { B = window.FIREBASE_CONFIG ? await fbBackend() : localBackend(); }
  catch (e) { console.error(e); B = localBackend(); toast('Could not reach Firebase, using demo mode'); }
  B.init(onState);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
